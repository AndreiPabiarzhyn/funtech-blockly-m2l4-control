<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Rabbit Run - Blockly</title>
  <link rel="stylesheet" href="style.css" />
  <script defer src="libs/blockly.min.js"></script>
</head>
<body>
  <header class="topbar">
    <div class="brand"><img src="img/rabbit.png" alt="" /><span data-i18n="brand">Rabbit Run</span></div>
    <div class="level-info">
      <button id="prevLevel" class="btn icon-btn" title="Предыдущий уровень" aria-label="Предыдущий уровень">‹</button>
      <div class="level-stack">
        <div class="level-row">
          <span id="levelTitle">Уровень 1/10</span>
          <span id="carrotIndicator" class="carrot-indicator"></span>
        </div>
        <div id="levelProgress" class="level-progress" aria-label="Level progress"></div>
      </div>
      <button id="nextLevel" class="btn icon-btn" title="Следующий уровень" aria-label="Следующий уровень">›</button>
    </div>
    <div class="actions">
      <select id="languageSelect" class="language-select" aria-label="Language">
        <option value="ru">RU</option>
        <option value="en">EN</option>
        <option value="pl">PL</option>
      </select>
      <button id="runBtn" class="btn primary"><span data-i18n="run">Запустить</span> ▶</button>
      <button id="clearBlocksBtn" class="btn"><span data-i18n="clearBlocks">Очистить</span> ✕</button>
      <button id="resetBtn" class="btn"><span data-i18n="reset">Сброс</span> ↻</button>
    </div>
  </header>

  <main class="layout">
    <section class="board-wrap">
      <div class="board-shell">
        <div id="board" class="board"></div>
        <canvas id="fxCanvas"></canvas>
      </div>
      <div id="legend" class="legend">
        <span><img src="img/rabbit.png" alt="" /> <span data-i18n="rabbit">кролик</span></span>
        <span><img src="img/door.png" alt="" /> <span data-i18n="exit">выход</span></span>
        <span><img src="img/carrot.png" alt="" /> <span data-i18n="carrot">морковка</span></span>
        <span><img src="img/wall.png" alt="" /> <span data-i18n="wall">стена</span></span>
        <span><img src="img/empty2.png" alt="" /> <span data-i18n="empty">пусто</span></span>
      </div>
      <div id="goal" class="goal"></div>
    </section>

    <section class="work-wrap">
      <div id="blockly" class="blockly"></div>
      <div class="limit"><span data-i18n="blocks">Блоков:</span> <span id="used">0</span>/<span id="limit">0</span></div>
    </section>
  </main>

  <dialog id="modal">
    <h3 id="modalTitle">Подсказка</h3>
    <div id="modalBody"></div>
    <div class="modal-actions"></div>
  </dialog>

  <footer class="footer" data-i18n="footer">Сделано для Kodland · разработчик: Andrei Pabiarzhyn · © 2025</footer>

  <script defer src="i18n.js"></script>
  <script defer src="tasks.js"></script>
  <script defer src="blocks.js"></script>
  <script defer src="app.js"></script>
</body>
</html>
